<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:356px;display:flex;flex-direction:column;gap:10px;color:var(--fg);font-size:13px;letter-spacing:-0.08px">
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="3">
    <div style="position:relative;border-radius:18px;background:var(--banner);backdrop-filter:blur(50px) saturate(190%);-webkit-backdrop-filter:blur(50px) saturate(190%);box-shadow:var(--popshadow);padding:11px 12px 11px 11px;display:flex;align-items:center;gap:10px">
      <sc-if value="{{ n.hover }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:-6px;top:-6px;width:20px;height:20px;border-radius:10px;background:var(--banner);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:var(--popshadow);display:flex;align-items:center;justify-content:center;color:var(--fg2)"><x-import component="SFIcon" from="./sf-icons.js" name="xmark" size="9" weight="3" hint-size="9px,9px"></x-import></div>
      </sc-if>
      <div style="width:36px;height:36px;border-radius:9px;flex:none;background:linear-gradient(180deg,#4865FF,#2D4EFF);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.25),0 1px 2px rgba(0,0,0,0.2)"><x-import component="SFIcon" from="./sf-icons.js" name="prbar" size="22" weight="2" hint-size="22px,22px"></x-import></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ n.title }}</span>
          <span style="font-size:11px;color:var(--fg2);flex:none">{{ n.time }}</span>
        </div>
        <span style="font-size:12.5px;line-height:1.35">{{ n.body }}</span>
      </div>
      <sc-if value="{{ n.hover }}" hint-placeholder-val="{{ false }}">
        <div style="flex:none;height:26px;padding:0 12px;border-radius:13px;background:var(--fill);font-size:12px;font-weight:500;display:flex;align-items:center">Abrir</div>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:356,&quot;height&quot;:300}}">
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { title: 'Review listo', time: 'ahora', body: 'posts-api#282: 5 comentarios para elegir', hover: true },
      { title: 'Nuevo PR para revisar', time: 'hace 4 min', body: '@juan: Fix login redirect' },
      { title: 'El CI falló en tu PR', time: 'hace 12 min', body: 'web-app#684 · Accessible color tokens for charts' },
    ] };
  }
}
</script>
</body>
</html>
