# PRBar for iPhone (plan 19). Generate the project with Scripts/ios-generate.sh; never edit the .xcodeproj by hand.
name: PRBarMobile
options:
  bundleIdPrefix: com.federico.prbar
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  # The app's logic and views; it depends on the root package's PRBarRemoteKit (path ../..).
  PRBarMobileKit:
    path: PRBarMobileKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PRBarMobile:
    type: application
    platform: iOS
    sources: [PRBarMobile]
    dependencies:
      - package: PRBarMobileKit
        product: PRBarMobileKit
      # Embedded in PlugIns/. Decrypts pushes with the keys in the shared keychain group (spec P.9).
      - target: PRBarMobileNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federico.prbar.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # One setting drives the aps-environment entitlement and the env the app tells the relay (sandbox/production).
      configs:
        Debug:
          PRBAR_APS_ENVIRONMENT: development
          PRBAR_PUSH_ENVIRONMENT: sandbox
        Release:
          PRBAR_APS_ENVIRONMENT: production
          PRBAR_PUSH_ENVIRONMENT: production
    # Signing (and so the $(AppIdentifierPrefix) of the keychain group) comes from DEVELOPMENT_TEAM in
    # Config/Local.xcconfig (not versioned; Scripts/iphone-setup.sh --team-id writes it). Without it the app still
    # builds for the simulator and unsigned for the device (Scripts/ios-build-check.sh).
    entitlements:
      path: PRBarMobile/Resources/PRBarMobile.entitlements
      properties:
        aps-environment: $(PRBAR_APS_ENVIRONMENT)
        com.apple.security.application-groups: [group.com.federico.prbar.ios]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.federico.prbar.ios.shared"]
    info:
      path: PRBarMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: PRBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes: [{ CFBundleURLName: com.federico.prbar.ios, CFBundleURLSchemes: [prbar] }]
        NSCameraUsageDescription: "PRBar uses the camera to scan the pairing code shown on your Mac."
        NSFaceIDUsageDescription: "PRBar uses Face ID before merging, pushing or approving."
        PRBarKeychainAccessGroup: $(AppIdentifierPrefix)com.federico.prbar.ios.shared
        PRBarAppGroup: group.com.federico.prbar.ios
        PRBarPushEnvironment: $(PRBAR_PUSH_ENVIRONMENT)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  # Notification service extension (spec P.9, plan 19 Task 8): opens the HPKE envelope of each push. Links only the
  # core of the kit (no SwiftUI) to stay well under the extension's memory limit.
  PRBarMobileNotifications:
    type: app-extension
    platform: iOS
    sources: [PRBarMobileNotifications]
    dependencies:
      - package: PRBarMobileKit
        product: PRBarMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federico.prbar.ios.notifications
    entitlements:
      path: PRBarMobileNotifications/PRBarMobileNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.com.federico.prbar.ios]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.federico.prbar.ios.shared"]
    info:
      path: PRBarMobileNotifications/Info.plist
      properties:
        CFBundleDisplayName: PRBar Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PRBarKeychainAccessGroup: $(AppIdentifierPrefix)com.federico.prbar.ios.shared
        PRBarAppGroup: group.com.federico.prbar.ios
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  PRBarMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PRBarMobileTests]
    # Only the host app: the kit is linked statically into the app, and the tests see its modules through it.
    dependencies:
      - target: PRBarMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.federico.prbar.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PRBarMobile:
    build: { targets: { PRBarMobile: all, PRBarMobileTests: [test] } }
    test: { targets: [PRBarMobileTests] }
