# /root/stack/prbar-relay/docker-compose.yml en el VPS (lo copia deploy.sh). Sin `ports:`: entra solo por Traefik.
# La imagen la construye deploy.sh con contexto en la raíz del repo (relay/ y web/): docker build -f src/relay/Dockerfile src.
# Es la instalación del autor (Traefik compartido en la red `coolify`): en otro server cambiar el host de las dos
# reglas `Host(...)`, la red, el certresolver y el middleware de redirección (relay/README.md, Deploying).
services:
  prbar-relay:
    image: prbar-relay:vps
    container_name: prbar-relay
    restart: unless-stopped
    env_file: /root/stack/env/prbar-relay.env
    mem_limit: 128m
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - prbar-relay-data:/data
    # Docker no reinicia solo un contenedor "unhealthy", pero el estado se ve en `docker ps` y Traefik deja de
    # mandarle tráfico. Traefik tampoco le manda nada hasta el primer chequeo bueno: de ahí el intervalo corto (después
    # de un deploy el relay tarda como mucho ~10 s en recibir tráfico).
    healthcheck:
      test: ["CMD", "/prbar-relay", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Logs acotados (30 MB como mucho): los teléfonos reconectan a cada rato.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.prbar-relay.rule: Host(`prbar.fcharbonnier.duckdns.org`)
      traefik.http.routers.prbar-relay.entrypoints: https
      traefik.http.routers.prbar-relay.tls: "true"
      traefik.http.routers.prbar-relay.tls.certresolver: letsencrypt
      traefik.http.services.prbar-relay.loadbalancer.server.port: "8080"
      traefik.http.routers.prbar-relay-http.rule: Host(`prbar.fcharbonnier.duckdns.org`)
      traefik.http.routers.prbar-relay-http.entrypoints: http
      traefik.http.routers.prbar-relay-http.middlewares: redirect-https@file
      # Si la prueba de 5 min (wsprobe) muestra que el entrypoint compartido corta los WebSocket a los ~60 s, NO se
      # tocan sus timeouts (spec V.2): con OK del usuario se agrega un entrypoint propio (p. ej. `prbar`, :8443, con
      # readTimeout 0) en el compose de Traefik y este router pasa a usarlo:
      #   traefik.http.routers.prbar-relay.entrypoints: prbar
volumes:
  prbar-relay-data:
networks:
  coolify:
    external: true
